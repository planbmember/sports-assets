name: import

# Imports a richlabel pilot directory (e.g. assets/team-logos/pilot) that has been
# committed to this repo, converts its PNGs to lossless WebP via sharp, regenerates
# manifest.json, removes the pilot inputs again, and commits the result back to main
# with [skip ci]. Run it, wait for the import commit to land, then bump the version
# and tag v* to publish.

on:
  workflow_dispatch:
    inputs:
      pilot-dir:
        description: "pilot directory committed to this repo (must contain manifest.json)"
        required: true
        default: "pilot"

permissions:
  contents: write # push the converted-assets commit back to main

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Convert pilot PNGs to lossless WebP and regenerate manifest.json
        run: node scripts/build-team-logos.mjs "${{ inputs.pilot-dir }}"
      - run: npm run check
      - name: Remove pilot inputs
        run: rm -rf "${{ inputs.pilot-dir }}"
      - name: Commit converted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A team-logos manifest.json "${{ inputs.pilot-dir }}"
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "import: regenerate team-logos as lossless WebP [skip ci]"
          git push
